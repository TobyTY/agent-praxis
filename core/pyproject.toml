[project]
name = "agent-praxis"
version = "0.0.1"
description = "Verified procedural memory for coding agents: learn skills from real sessions, prove they help, limit what they can do."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [{ name = "Kushal Tandon" }]
keywords = ["claude-code", "agent-skills", "ai-agents", "procedural-memory", "llm-security"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development",
]
# Runtime dependencies: none. Every addition needs an ADR (Rule A7).
dependencies = []

[project.urls]
Homepage = "https://github.com/TobyTY/agent-praxis"
Issues = "https://github.com/TobyTY/agent-praxis/issues"

[project.scripts]
praxis = "praxis.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.3",
  "hypothesis>=6.112",
  "ruff>=0.7",
  "mypy>=1.13",
  "pytest-cov>=5.0",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["praxis"]

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = ["praxis/generated"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = ["S101", "S603", "S607", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S108", "S311", "E501"]

[tool.mypy]
strict = true
python_version = "3.11"
files = ["praxis"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = ["live: needs PRAXIS_LIVE=1 and spends real usage"]

[tool.coverage.run]
source = ["praxis"]
omit = ["praxis/generated/*"]
