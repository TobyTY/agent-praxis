name: perf

on:
  push:
    branches: [main]
    paths: ["packages/hooks/**", "plugin/**", ".github/workflows/perf.yml"]
  pull_request:
    paths: ["packages/hooks/**", "plugin/**", ".github/workflows/perf.yml"]

permissions: read-all

jobs:
  hook-latency:
    name: hook wall time (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: packages/hooks
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: packages/hooks/package-lock.json
      - run: npm ci
      - run: node build.mjs
      - name: Part L budgets and 20% regression check
        run: node bench/perf.mjs --runs 200 | tee "$RUNNER_TEMP/perf.md"
        shell: bash
      - name: job summary
        if: always()
        run: cat "$RUNNER_TEMP/perf.md" >> "$GITHUB_STEP_SUMMARY"
        shell: bash
