version: 2
updates:
  - package-ecosystem: npm
    directory: /packages/hooks
    schedule: { interval: weekly }
    groups:
      dev-tooling: { patterns: ["*"] }
  - package-ecosystem: uv
    directory: /core
    schedule: { interval: weekly }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
